<!-- Showcase for the website: the docs link to this file, and the site turns the table into a live gearbox and two gauges. -->
<figure class="ns-gearbox" data-speed-max="250" data-speed-start="0">
  <figcaption>The standard powertrain RPM, the automatic gearbox, and two interior gauges. Speed is an input here, not a physics result. Drag the speed, and the plugin code computes the RPM, the gear, and the needles. On the ground, the RPM follows the wheel speed only, so no throttle is necessary. A jump in speed can skip gears, because the gearbox shifts again after each Shift Delay while the RPM stays past a shift point. The gear ratios are an example. The other values are the plugin defaults.</figcaption>
  <table>
    <thead>
      <tr><th>Setting</th><th>Value</th></tr>
    </thead>
    <tbody>
      <tr data-key="gear-ratios"><td>Gear Ratios (example)</td><td>3.8, 2.4, 1.7, 1.3, 1.0</td></tr>
      <tr data-key="differential-ratio"><td>Differential Ratio</td><td>3.05</td></tr>
      <tr data-key="wheel-radius"><td>Wheel Radius (m)</td><td>0.28</td></tr>
      <tr data-key="max-rpm"><td>Max RPM</td><td>7000</td></tr>
      <tr data-key="upshift-ratio"><td>Upshift Ratio (of Max RPM)</td><td>0.85</td></tr>
      <tr data-key="downshift-ratio"><td>Downshift Ratio (of Max RPM)</td><td>0.3</td></tr>
      <tr data-key="shift-delay"><td>Shift Delay (s)</td><td>0.2</td></tr>
      <tr data-key="tachometer"><td>Tachometer: Input Range to Output Range</td><td>0 to 7000 RPM, 0 to 270 degrees</td></tr>
      <tr data-key="speedometer"><td>Speedometer: Input Range to Output Range</td><td>0 to 200 KPH, 0 to 270 degrees</td></tr>
      <tr data-key="smoothing-speed"><td>Smoothing Speed (when Use Smoothing is on)</td><td>5</td></tr>
    </tbody>
  </table>
</figure>
